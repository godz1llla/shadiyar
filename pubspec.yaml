name: tiri_tarih
description: Тірі Тарих - интерактивный гид по Кызылординской области
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  flutter_svg: ^2.0.9
  geolocator: ^12.0.0
  flutter_tts: ^4.0.2
  video_player: ^2.8.2
  http: ^1.2.0
  google_generative_ai: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
